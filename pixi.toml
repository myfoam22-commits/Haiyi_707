[workspace]
name = "biostat707-checkpoint1"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
r-base = "4.5.*"
"r-data.table" = "*"
r-dplyr = "*"
r-tidyr = "*"
r-readr = "*"
r-ggplot2 = "*"
r-gtsummary = "*"
r-naniar = "*"
r-here = "*"
r-rsample = ">=1.3.2,<2"
r-recipes = ">=1.4.0,<2"
r-knitr = ">=1.52,<2"
r-tidyverse = ">=2.0.0,<3"
r-tidymodels = ">=1.4.1,<2"
r-glmnet = ">=5.0,<6"
r-mgcv = ">=1.9_4,<2"
r-ranger = "*"
r-broom = "*"
quarto = ">=1.9.38,<2"
deno = ">=2.4.5,<2.5"

[tasks]
checkpoint1 = "Rscript checkpoint1.R"

checkpoint2 = "quarto render checkpoint2.qmd --output-dir output"
